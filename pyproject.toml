[project]
name = "datalens-backend"
version = "1.0.0"
description = "DataLens backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "groq>=0.9.0",
    "pydantic>=2.7.1",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
]
